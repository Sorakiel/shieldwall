name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Системные зависимости окна SFML на Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxrandr-dev libxcursor-dev libxi-dev libudev-dev libgl1-mesa-dev xvfb

      - name: Сборка приложения
        run: |
          cmake -B build
          cmake --build build --config Release

      - name: Сборка SFML и проверки отрисовки
        run: |
          cmake -B build-gui -DSHIELDWALL_GRAPHICS=ON -DSHIELDWALL_VISUAL_TESTS=ON
          cmake --build build-gui --config Release --parallel 4

      - name: Экраны SFML без открытия окна
        if: runner.os == 'Linux'
        run: xvfb-run -a ./build-gui/sfml_visual_tests assets build/previews

      # tests/ui собирает и тесты оболочки, и тесты данных
      - name: Тесты
        run: |
          cmake -S tests/ui -B build/tests
          cmake --build build/tests --config Release
          ctest --test-dir build/tests -C Release --output-on-failure
